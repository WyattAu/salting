[package]
name = "salting"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Opinionated Argon2id password hashing for Rust — OWASP-recommended defaults, configurable parameters, and PHC string format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/salting"
keywords = ["password", "hashing", "argon2", "argon2id", "security"]
categories = ["authentication", "cryptography"]

[dependencies]
argon2 = "0.5"
rand = "0.8"
thiserror = "2"

[[bench]]
name = "salting_bench"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[features]
default = ["argon2id"]
argon2id = []
