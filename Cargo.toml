[package]
name = "salting"
version = "1.2.1"
edition = "2024"
rust-version = "1.85"
description = "Opinionated Argon2id password hashing for Rust — OWASP-recommended defaults, configurable parameters, and PHC string format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/salting"
keywords = ["password", "hashing", "argon2", "argon2id", "security"]
categories = ["authentication", "cryptography"]
exclude = ["/target"]

[dependencies]
argon2 = { version = "0.6", features = ["password-hash"] }
password-hash = { version = "0.6", features = ["rand_core"] }
thiserror = "2"
zeroize = "1"
zxcvbn = { version = "2", optional = true }

[[bench]]
name = "salting_bench"
harness = false

[[bench]]
name = "hash_bench"
harness = false

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_hot_path.rs.
[[bench]]
name = "iai_hot_path"
harness = false

[dev-dependencies]
bcrypt = "0.19"
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1"
scrypt = "0.11"
# Deterministic CI perf gate (instruction counts; needs valgrind to run).
iai-callgrind = "0.16"

[features]
default = ["argon2id"]
argon2id = []
strength = ["dep:zxcvbn"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
