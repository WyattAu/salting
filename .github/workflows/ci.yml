name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: a
      all-features: true
      loom: false
      wasm: false
      miri: false

  # Fuzz smoke: 60s per parser target. Full runs are local/nightly; this gate
  # catches regressions on the PHC-string parsing surface early.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: PHC parse smoke (60s)
        run: cargo fuzz run fuzz_parse -- -max_total_time=60 -max_len=2048 -detect_leaks=0
      - name: policy smoke (60s)
        run: cargo fuzz run fuzz_policy -- -max_total_time=60 -max_len=2048 -detect_leaks=0
